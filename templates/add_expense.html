{% extends "base.html" %}

{% block title %}Add Expense{% endblock %}

{% block content %}

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-success text-white">
<h3>Add Expense</h3>
</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">
<label>Title</label>
<input
type="text"
class="form-control"
name="title"
required>
</div>

<div class="mb-3">
<label>Category</label>

<select
class="form-control"
name="category">

<option>Food</option>
<option>Travel</option>
<option>Shopping</option>
<option>Bills</option>
<option>Entertainment</option>
<option>Others</option>

</select>

</div>

<div class="mb-3">
<label>Amount</label>
<input
type="number"
step="0.01"
class="form-control"
name="amount"
required>
</div>

<div class="mb-3">
<label>Date</label>
<input
type="date"
class="form-control"
name="date"
required>
</div>

<button class="btn btn-primary">
Save Expense
</button>

</form>

</div>
</div>

</div>

{% endblock %}
