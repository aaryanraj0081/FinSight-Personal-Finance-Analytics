<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FinSight</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<!-- ================= SIDEBAR ================= -->

<button class="sidebar-toggle" type="button" aria-label="Toggle navigation" aria-expanded="true">
    <span></span>
    <span></span>
    <span></span>
</button>

<aside class="app-sidebar">

    <a class="sidebar-brand" href="{{ url_for('main.dashboard') }}">
        <span class="brand-mark">₹</span>
        <span>FinSight</span>
    </a>

    <nav class="sidebar-nav" aria-label="Main navigation">
        <a class="{% if request.endpoint == 'main.dashboard' %}active{% endif %}" href="{{ url_for('main.dashboard') }}">Dashboard</a>
        <a class="{% if request.endpoint == 'main.profile_setup' %}active{% endif %}" href="{{ url_for('main.profile_setup' }}">Profile</a>
        <a class="{% if request.endpoint == 'expenses' %}active{% endif %}" href="{{ url_for('expenses') }}">Expenses</a>
        <a class="{% if request.endpoint == 'add_expense' %}active{% endif %}" href="{{ url_for('add_expense') }}">Add Expense</a>
        <a class="{% if request.endpoint == 'set_budget' %}active{% endif %}" href="{{ url_for('set_budget') }}">Budget</a>
        <a class="{% if request.endpoint == 'investments' %}active{% endif %}" href="{{ url_for('investments') }}">Investments</a>
        <a class="{% if request.endpoint == 'spending_analysis' %}active{% endif %}" href="{{ url_for('spending_analysis') }}">Spending Analysis</a>
        <a class="{% if request.endpoint == 'goals' %}active{% endif %}" href="{{ url_for('goals') }}">Goals</a>
        <a class="nav-info {% if request.endpoint == 'alerts' %}active{% endif %}" href="{{ url_for('alerts') }}">Alerts</a>
        <a class="{% if request.endpoint == 'financial_health' %}active{% endif %}" href="{{ url_for('financial_health') }}">Financial Health</a>
        <a class="{% if request.endpoint == 'pdf_report' %}active{% endif %}" href="{{ url_for('pdf_report') }}">PDF Report</a>
    </nav>

    <a class="sidebar-logout" href="{{ url_for('auth.logout' }}">Logout</a>

</aside>


<!-- ================= MAIN CONTENT ================= -->

<main>

    <div class="container mt-4 page-content">

        {% block content %}

        {% endblock %}

    </div>

</main>


<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

<script>
    const sidebarToggle = document.querySelector('.sidebar-toggle');

    sidebarToggle.addEventListener('click', () => {
        const isClosed = document.body.classList.toggle('sidebar-collapsed');
        sidebarToggle.setAttribute('aria-expanded', String(!isClosed));
    });
</script>

</body>

</html>
