<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PDF Report - FinSight</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background-color: #f8f9fa;
        }

        .report-container {
            max-width: 900px;
            margin: 50px auto;
        }

        .report-card {
            background: white;
            border-radius: 12px;
            padding: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        .report-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .report-title {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .report-description {
            color: #6c757d;
            font-size: 17px;
            margin-bottom: 30px;
        }

        .download-btn {
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 8px;
        }

        .back-btn {
            margin-left: 10px;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 8px;
        }

    </style>

</head>

<body>

    <div class="container report-container">

        <div class="report-card">

            <div class="report-icon">
                📄
            </div>

            <h1 class="report-title">
                Your Financial PDF Report
            </h1>

            <p class="report-description">

                Your complete FinSight financial report
                is ready.

                <br>

                The report contains your
                <strong>expenses, budgets, financial goals
                and investments.</strong>

            </p>

            <h5 class="mb-4">
                Do you want to download your financial report?
            </h5>

            <a
                href="{{ url_for('download_pdf') }}"
                class="btn btn-primary download-btn"
            >
                📥 Download PDF Report
            </a>

            <a
                href="{{ url_for('main.dashboard') }}"
                class="btn btn-secondary back-btn"
            >
                ← Back to Dashboard
            </a>

        </div>

    </div>

</body>

</html>
