{% extends "base.html" %}

{% block title %}Set Budget{% endblock %}

{% block content %}

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-info text-white">
<h3>Monthly Budget</h3>
</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Month</label>

<input
type="month"
class="form-control"
name="month"
required>

</div>

<div class="mb-3">

<label>Budget Amount</label>

<input
type="number"
step="0.01"
class="form-control"
name="amount"
required>

</div>

<button class="btn btn-primary">

Save Budget

</button>

</form>

</div>

</div>

</div>

{% endblock %}
