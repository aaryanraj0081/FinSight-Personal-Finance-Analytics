{% extends "base.html" %}

{% block title %}Edit Expense{% endblock %}

{% block content %}

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">
<h3>Edit Expense</h3>
</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">
<label>Title</label>
<input
type="text"
class="form-control"
name="title"
value="{{ expense.title }}"
required>
</div>

<div class="mb-3">
<label>Category</label>

<input
type="text"
class="form-control"
name="category"
value="{{ expense.category }}"
required>

</div>

<div class="mb-3">
<label>Amount</label>
<input
type="number"
step="0.01"
class="form-control"
name="amount"
value="{{ expense.amount }}"
required>
</div>

<div class="mb-3">
<label>Date</label>
<input
type="date"
class="form-control"
name="date"
value="{{ expense.date }}"
required>
</div>

<button class="btn btn-success">
Update Expense
</button>

</form>

</div>

</div>

</div>

{% endblock %}
